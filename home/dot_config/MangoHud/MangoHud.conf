# Diagnostic overlay for Ascension WoW perf tuning
# Key question: is GPU_load pinned ~99% (GPU-bound -> lower res / gamescope+FSR)
# or is one CPU core maxed while GPU_load is low (CPU-bound -> view distance/addons)?

# Do NOT hook the Electron launcher / helper exes — MangoHud's Vulkan layer
# crashes Chromium/Electron. Only the actual game (Ascension.exe) gets the overlay.
blacklist=Ascension Launcher.exe,AscensionClientServices.exe,project-ascension-update.exe,MMgr64.exe,WowError.exe
fps
frametime
frame_timing

gpu_stats
gpu_load_change
gpu_temp
gpu_core_clock
vram

cpu_stats
cpu_load_change
cpu_temp
core_load          # per-core load — watch for a single core pinned at 100%
cpu_mhz

ram

# placement / look
position=top-left
font_size=20
background_alpha=0.4
toggle_hud=Shift_R+F12
