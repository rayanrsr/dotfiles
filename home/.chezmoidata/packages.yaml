      - feishin-bin # Music streaming client
      - firefox # Web browser
      - flameshot # Screenshot tool
      - gamemode # Game performance daemon
      - gamescope # Gaming micro-compositor
      - ghidra # Reverse engineering suite
      - gimp # Image editor
      - google-cloud-cli # gcloud CLI
      - heroic-games-launcher # Epic/GOG launcher
      - jagex-launcher # RuneScape launcher
      - jetbrains-toolbox # JetBrains IDE manager
      - lib32-gamemode # 32-bit gamemode for Proton games
      - lib32-mangohud # 32-bit MangoHud for Proton games
      - llama-swap-bin # Hot-swap llama.cpp models
      - llama.cpp-cuda # GPU local LLM inference
      - lmstudio-bin # Local LLM GUI
      - localsend # LAN file sharing
      - mangohud # In-game performance overlay
      - miniflux-bin # RSS reader server
      - path-of-building-community-git # Path of Exile build planner
      - prismlauncher # Minecraft launcher
      - proton-mail-bin # Proton Mail desktop
      - proton-vpn-gtk-app # Proton VPN client
      - runelite # RuneScape client
